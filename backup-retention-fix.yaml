apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-backup-retention-fix
  namespace: scalefield
data:
  # Shell script to copy a file to a list of pods
  backup-retention-fix.sh: |
    #!/bin/bash
    #
    #   backup-retention-fix.sh
    #
    #   script copies fixed version of postgres_backup.sh
    #   ref bug https://github.com/zalando/spilo/issues/1015
    #
    #   to execute:
    #       KUBECONFIG=... ./backup-retention-fix.sh  | tee ./backup-retention-fix.log
    #

    # Fetch the list of pods with spilo-role=master across all namespaces
    pod_list=$(kubectl get pods --all-namespaces -l application=spilo -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.namespace}{"\n"}{end}')

    # Check if the pod_list is not empty
    if [ -z "$pod_list" ]; then
      echo "No pods with role=master found."
      exit 0
    fi

    # this is only required when mounting file from configmap inside the job
    TEMP_FILE=$(mktemp)
    cat /scripts/postgres_backup.sh > "$TEMP_FILE"
    chmod 0755 "$TEMP_FILE"

    # Process each pod name and namespace pair
    echo "$pod_list" | while read -r pod_name namespace; do
      echo -n "Processing pod: $pod_name in namespace: $namespace"

      kubectl cp "$TEMP_FILE" \
        "$pod_name:/scripts/postgres_backup.sh" \
        -c postgres --no-preserve \
        -n "$namespace"

      if [ $? -eq 0 ]; then
        echo " done"
      else
        echo " error"
      fi

    done

  # File to be copied to the pods
  postgres_backup.sh: |
    #!/bin/bash

    function log
    {
        echo "$(date "+%Y-%m-%d %H:%M:%S.%3N") - $0 - $*"
    }

    [[ -z $1 ]] && echo "Usage: $0 PGDATA" && exit 1

    log "I was called as: $0 $*"

    readonly PGDATA=$1
    DAYS_TO_RETAIN=$BACKUP_NUM_TO_RETAIN

    IN_RECOVERY=$(psql -tXqAc "select pg_catalog.pg_is_in_recovery()")
    readonly IN_RECOVERY
    if [[ $IN_RECOVERY == "f" ]]; then
        [[ "$WALG_BACKUP_FROM_REPLICA" == "true" ]] && log "Cluster is not in recovery, not running backup" && exit 0
    elif [[ $IN_RECOVERY == "t" ]]; then
        [[ "$WALG_BACKUP_FROM_REPLICA" != "true" ]] && log "Cluster is in recovery, not running backup" && exit 0
    else
        log "ERROR: Recovery state unknown: $IN_RECOVERY" && exit 1
    fi

    # leave at least 2 days base backups before creating a new one
    [[ "$DAYS_TO_RETAIN" -lt 2 ]] && DAYS_TO_RETAIN=2

    if [[ "$USE_WALG_BACKUP" == "true" ]]; then
        readonly WAL_E="wal-g"
        [[ -z $WALG_BACKUP_COMPRESSION_METHOD ]] || export WALG_COMPRESSION_METHOD=$WALG_BACKUP_COMPRESSION_METHOD
        export PGHOST=/var/run/postgresql
    else
        readonly WAL_E="wal-e"

        # Ensure we don't have more workes than CPU's
        POOL_SIZE=$(grep -c ^processor /proc/cpuinfo 2>/dev/null || 1)
        [ "$POOL_SIZE" -gt 4 ] && POOL_SIZE=4
        POOL_SIZE=(--pool-size "$POOL_SIZE")
    fi

    BEFORE=""
    LEFT=0

    NOW=$(date +%s -u)
    readonly NOW
    while read -r name last_modified rest; do
        last_modified=$(date +%s -ud "$last_modified")
        if [ $(((NOW-last_modified)/86400)) -ge $DAYS_TO_RETAIN ]; then
            if [ -z "$BEFORE" ] || [ "$last_modified" -gt "$BEFORE_TIME" ]; then
                BEFORE_TIME=$last_modified
                BEFORE=$name
            fi
        else
            # count how many backups will remain after we remove everything up to certain date
            ((LEFT=LEFT+1))
        fi
    done < <($WAL_E backup-list 2> /dev/null | sed '0,/^backup_name\s*\(last_\)\?modified\s*/d')

    # we want keep at least N backups even if the number of days exceeded
    if [ -n "$BEFORE" ] && [ $LEFT -ge $DAYS_TO_RETAIN ]; then
        if [[ "$USE_WALG_BACKUP" == "true" ]]; then
            $WAL_E delete before FIND_FULL "$BEFORE" --confirm
        else
            $WAL_E delete --confirm before "$BEFORE"
        fi
    fi

    # push a new base backup
    log "producing a new backup"
    # We reduce the priority of the backup for CPU consumption
    exec nice -n 5 $WAL_E backup-push "$PGDATA" "${POOL_SIZE[@]}"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-retention-fix
  namespace: scalefield
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 15
  failedJobsHistoryLimit: 15
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
          - name: kubectl-container
            image: bitnami/kubectl:latest  # Image with kubectl installed
            command: ["/bin/sh", "-c", "cd /scripts && ./backup-retention-fix.sh"]
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
          serviceAccountName: cluster-gw
          restartPolicy: Never
          volumes:
          - name: script-volume
            configMap:
              name: pg-backup-retention-fix
              items:
              - key: backup-retention-fix.sh
                path: backup-retention-fix.sh
                mode: 0755
              - key: postgres_backup.sh
                path: postgres_backup.sh
                mode: 0644
